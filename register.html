<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apply for Membership — SJB Association</title>
<meta property="og:site_name" content="SJB Association" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Become a Member — SJB Association" />
<meta property="og:description" content="Register to join the SJB Alumni & Members Association." />
<meta property="og:url" content="https://sjb-alumni-site-630b6c.vercel.app/register.html" />
<meta property="og:image" content="https://sjb-alumni-site-630b6c.vercel.app/assets/img/og-default.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Become a Member — SJB Association" />
<meta name="twitter:description" content="Register to join the SJB Alumni & Members Association." />
<meta name="twitter:image" content="https://sjb-alumni-site-630b6c.vercel.app/assets/img/og-default.png" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:460px;">
    <h2>Apply for membership</h2>
    <p class="subtitle">Every application is reviewed by an admin before you can sign in. After that, a short step collects the rest of your details (alumni status, graduation year, phone, profession, and a photo).</p>

    <div id="alert-box"></div>

    <button type="button" class="btn-google" id="google-btn">Continue with Google</button>
    <div class="divider">or</div>

    <form id="register-form">
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        <small style="color:var(--text-muted);">At least 8 characters.</small>
      </div>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Submit Application</button>
    </form>

    <p class="form-footer">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { registerWithEmail, loginWithGoogle } from './assets/js/auth.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav();
  mountFooter();

  document.getElementById('google-btn').addEventListener('click', loginWithGoogle);

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Submitting...';

    const result = await registerWithEmail({
      fullName: document.getElementById('full_name').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });

    const alertBox = document.getElementById('alert-box');
    if (result.error) {
      alertBox.innerHTML = `<div class="alert alert-error">${String(result.error)}</div>`;
      btn.disabled = false; btn.textContent = 'Submit Application';
    } else {
      alertBox.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
      document.getElementById('register-form').style.display = 'none';
    }
  });
</script>
</body>
</html>
