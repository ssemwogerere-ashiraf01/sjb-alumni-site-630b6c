<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset Password — SJB Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Reset your password</h2>
    <p class="subtitle">Enter your account email and we'll send you a link to set a new password.</p>
    <div id="alert-box"></div>
    <form id="reset-form">
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" required /></div>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Send Reset Link</button>
    </form>
    <p class="form-footer"><a href="login.html">Back to Sign In</a></p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav();
  mountFooter();

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Sending...';
    const email = document.getElementById('email').value.trim();

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${window.location.origin}/reset-password-confirm.html`,
    });

    const alertBox = document.getElementById('alert-box');
    // Always show a generic success message, whether or not the email
    // exists — this stops attackers from using this form to discover
    // which emails are registered members.
    alertBox.innerHTML = `<div class="alert alert-success">If that email is registered, a reset link is on its way. Check your inbox (and spam folder).</div>`;
    document.getElementById('reset-form').style.display = 'none';
    if (error) console.warn(error.message);
  });
</script>
</body>
</html>
