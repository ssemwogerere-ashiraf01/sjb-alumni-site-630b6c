<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset Password — SJB Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Reset your password</h2>
    <p class="subtitle" id="subtitle">Enter the email on your membership profile. We’ll send a 6-digit code (via Resend).</p>
    <div id="alert-box"></div>

    <form id="reset-form">
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" required autocomplete="email" /></div>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">Send reset code</button>
    </form>

    <form id="code-form" style="display:none;margin-top:1rem;">
      <div class="form-group"><label for="token">Code from email</label><input type="text" id="token" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code" /></div>
      <div class="form-group"><label for="password">New password</label><input type="password" id="password" minlength="8" required autocomplete="new-password" /></div>
      <div class="form-group"><label for="confirm">Confirm password</label><input type="password" id="confirm" minlength="8" required autocomplete="new-password" /></div>
      <button type="submit" class="btn btn-gold btn-block" id="code-submit-btn">Verify code &amp; set password</button>
      <p class="form-footer"><button type="button" id="resend-btn" class="btn btn-outline" style="width:100%;margin-top:0.5rem;">Resend code</button></p>
    </form>

    <p class="form-footer"><a href="login.html">Back to Sign In</a></p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './assets/js/supabase-client.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  mountNav();
  mountFooter();

  const RESET_URL = `${SUPABASE_URL}/functions/v1/password-reset`;
  let pendingEmail = '';

  async function callReset(payload) {
    const res = await fetch(RESET_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        'apikey': SUPABASE_PUBLISHABLE_KEY,
      },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');
    btn.disabled = true; btn.textContent = 'Sending...';
    pendingEmail = document.getElementById('email').value.trim().toLowerCase();

    const { ok, data } = await callReset({ action: 'request', email: pendingEmail });
    if (!ok && data.error) {
      alertBox.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
      btn.disabled = false; btn.textContent = 'Send reset code';
      return;
    }

    alertBox.innerHTML = `<div class="alert alert-success">${data.message || 'If that email is registered, a reset code is on its way. Check inbox and spam.'}</div>`;
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('code-form').style.display = 'block';
    document.getElementById('subtitle').textContent = 'Enter the code from your email and choose a new password.';
    btn.disabled = false; btn.textContent = 'Send reset code';
  });

  document.getElementById('resend-btn')?.addEventListener('click', async () => {
    if (!pendingEmail) return;
    const btn = document.getElementById('resend-btn');
    btn.disabled = true;
    await callReset({ action: 'request', email: pendingEmail });
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-success">Code resent if the account exists.</div>`;
    btn.disabled = false;
  });

  document.getElementById('code-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alert-box');
    const btn = document.getElementById('code-submit-btn');
    const token = document.getElementById('token').value.trim();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (pw !== confirm) {
      alertBox.innerHTML = `<div class="alert alert-error">Passwords do not match.</div>`;
      return;
    }
    btn.disabled = true; btn.textContent = 'Verifying...';

    const { ok, data } = await callReset({
      action: 'confirm',
      email: pendingEmail,
      code: token,
      password: pw,
    });

    if (!ok) {
      alertBox.innerHTML = `<div class="alert alert-error">${data.error || 'Could not reset password.'}</div>`;
      btn.disabled = false; btn.textContent = 'Verify code & set password';
      return;
    }

    alertBox.innerHTML = `<div class="alert alert-success">${data.message || 'Password updated.'} Redirecting…</div>`;
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  });
</script>
</body>
</html>
