<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Membership Fee — SJB Association</title>
<link rel="stylesheet" href="assets/css/style.css" />
<script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body>
<div id="app-nav"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:460px;text-align:center;">
    <h2>One last step</h2>
    <p class="subtitle" id="fee-subtitle">Loading your membership fee...</p>

    <div id="alert-box"></div>

    <div class="form-group" style="text-align:left;">
      <label for="currency">Pay in</label>
      <select id="currency">
        <option value="UGX" id="ugx-option">Ugandan Shillings</option>
        <option value="USD">US Dollars (converted at today's rate)</option>
      </select>
    </div>

    <button type="button" class="btn btn-gold btn-block" id="pay-btn">Pay Membership Fee</button>
    <p class="form-footer">Already paid and it's not reflecting? <a href="mailto:admin@sjbassociation.org">Contact an admin</a> with your payment reference.</p>
  </div>
</div>

<div id="app-footer"></div>

<script type="module">
  import { supabase } from './assets/js/supabase-client.js';
  import { payMembershipFee } from './assets/js/flutterwave.js';
  import { mountNav, mountFooter } from './assets/js/nav.js';
  import './assets/js/session-guard.js';
  mountNav();
  mountFooter();

  // Guard: must be logged in and approved; if fee already paid, skip ahead.
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = 'login.html';
  const { data: profile } = await supabase.from('profiles').select('status, membership_class, membership_fee_paid').eq('id', session.user.id).single();
  if (!profile || profile.status !== 'approved') window.location.href = 'pending-approval.html';
  if (profile?.membership_fee_paid) window.location.href = 'dashboard.html';

  // Show the correct fee for this member's tier (alumni: 3,000 UGX, non-alumni: 15,000 UGX)
  const feeKey = profile?.membership_class === 'alumni' ? 'membership_fee_alumni' : 'membership_fee_non_alumni';
  const { data: settings } = await supabase.from('app_settings').select('value').eq('key', feeKey).maybeSingle();
  const feeAmount = settings?.value?.amount ?? (profile?.membership_class === 'alumni' ? 3000 : 15000);
  const tierLabel = profile?.membership_class === 'alumni' ? 'alumni' : 'non-alumni';
  document.getElementById('fee-subtitle').textContent =
    tierLabel === 'alumni'
      ? `As an alumni member, a one-time fee of UGX ${feeAmount.toLocaleString()} confirms your place in the association and unlocks savings groups and full member tools.`
      : `As a non-alumni member, a one-time fee of UGX ${feeAmount.toLocaleString()} is required before you can join savings groups or use paid member features. Your application was already approved by an admin — this step is only the fee.`;
  document.getElementById('ugx-option').textContent = `Ugandan Shillings (UGX ${feeAmount.toLocaleString()})`;

  document.getElementById('pay-btn').addEventListener('click', async () => {
    const btn = document.getElementById('pay-btn');
    btn.disabled = true; btn.textContent = 'Opening secure checkout...';
    const currency = document.getElementById('currency').value;
    await payMembershipFee({ currency });
    btn.disabled = false; btn.textContent = 'Pay Membership Fee';
  });
</script>
</body>
</html>
